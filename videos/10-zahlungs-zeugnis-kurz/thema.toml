# Video 10 – Dein Zahlungs-Zeugnis, Kurzfassung (ca. 40-44 s, nie über 50 s)
# Quelle: Auftrag im Chat vom 2026-11-05. Texte wörtlich übernommen, außer Szene 3 und 6 (Ersatz-Clips, Pointe ans Bild angepasst).
# Keine Score-Werte, Punkte, Prozente, Gewichtungen; keine Versprechen. "Schufa" nur sachlich.
#
# Vertonen:  python3 tools/vertonung.py videos/10-zahlungs-zeugnis-kurz --am-stueck --medien output/arbeit/10-zahlungs-zeugnis-kurz/audio --tempo 1.0 --stabilitaet 0.5
#   Schnitte von Hand geprüft: --schnitte 5.72,11.02,19.27,26.29,33.69
# Schneiden: python3 tools/schnitt.py videos/10-zahlungs-zeugnis-kurz --medien output/arbeit/10-zahlungs-zeugnis-kurz/audio \
#              --arbeitsordner output/arbeit/10-zahlungs-zeugnis-kurz/schnitt --ausgabe output/zahlungs-zeugnis-kurz.mp4

[video]
nummer = "10"
titel = "Dein Zahlungs-Zeugnis (kurz)"
thema = "Schufa-Score und Zahlungsverhalten bei der Wohnungssuche"
lerneffekt = "Dein Zahlungsverhalten kann beeinflussen, ob du eine Wohnung oder einen Vertrag bekommst. Pünktlich zahlen und Rechnungen nicht liegen lassen."
zielgruppe = "breit: Teenager, Azubis, Berufseinsteiger"
ton = "trockener, sarkastischer Erzähler im Stil einer ruhigen Naturdoku, Understatement"
disclaimer = "Keine Finanzberatung"
referenzbild = "bibliothek/bilder/brokey-abos.jpg"
caption = "TODO: Caption auswählen"
hashtags = ["#finanzen", "#schufa", "#wohnung", "#finanzbildung"]
betonen = ["Zahlungsverhalten", "pünktlich bezahlen", "Keine Finanzberatung"]
# Laut Auftrag: Clip auf Sprechlänge + Nachwirken kürzen (clip_ganz aus), zu kurze Clips bis 0,8-fach
# Sprechzeit 42,0 s: Vorlauf/Pause je 0,15 s (natürliche Atempausen kommen dazu)
vorlauf = 0.15
pause_nach = 0.15
clip_min_tempo = 0.8
clip_ton = 0.2
clip_ganz = false
