betonen = ["nicht brauchst", "Nur heute", "24-Stunden-Regel", "Geld gespart"]

[[fakt]]
text = "Die 24-Stunden-Regel kann Impulskäufe verringern – gängige Faustregel, kein Gesetz, nicht als Garantie formulieren"
