# Video 02 – Impulskäufe und die 24-Stunden-Regel
# Quelle: video-impulskaeufe.md (Texte, Szenen, Einblendtexte, Prompts wörtlich übernommen).
# [pause] im Sprechertext = kurze Pause vor einer Pointe (wird nur in der Vertonung als Stille eingefügt).
# medien: vorhandenes Material aus bibliothek/ als Ersatz, bis eigene Clips zu den Szenen da sind.
#   "#oben" / "#mitte" / "#unten" = Bildausschnitt; Standbilder bekommen außerhalb des Hooks langsamen Zoom.
#
# Vertonen:  python3 tools/vertonung.py videos/02-impulskaeufe --medien output/arbeit/02-impulskaeufe/audio
# Schneiden: python3 tools/schnitt.py videos/02-impulskaeufe --medien output/arbeit/02-impulskaeufe/audio \
#              --arbeitsordner output/arbeit/02-impulskaeufe/schnitt --ausgabe output/impulskaeufe.mp4

[video]
nummer = "02"
titel = "Impulskäufe und die 24-Stunden-Regel"
thema = "Spontane Käufe, die man nicht braucht"
lerneffekt = "Wer einen unnötigen Kauf einen Tag liegen lässt, spart oft Geld, weil der Impuls meist verfliegt."
zielgruppe = "breit, besonders Teenager, Azubis, Berufseinsteiger"
ton = "trockener Erzähler, sarkastisch, ruhig, kurze Pausen vor den Pointen"
disclaimer = "Keine Finanzberatung"
referenzbild = "bibliothek/bilder/brokey-abos.jpg"
caption = "Dein Warenkorb will nur dein Bestes. Dein Geld."
