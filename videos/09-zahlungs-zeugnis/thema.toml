# Video 09 – Dein Zahlungs-Zeugnis (ca. 60-64 s)
# Quelle: Auftrag im Chat vom 2026-11-05. Texte wörtlich übernommen, außer Szene 3 und 8 (Ersatz-Clips, Pointe ans Bild angepasst).
# Keine Score-Werte, Punkte, Prozente, Gewichtungen; keine Versprechen (Wohnung/Kredit). "Schufa" nur sachlich.
#
# Vertonen:  python3 tools/vertonung.py videos/09-zahlungs-zeugnis --am-stueck --medien output/arbeit/09-zahlungs-zeugnis/audio --tempo 1.0 --stabilitaet 0.5
#   Schnitte von Hand geprüft: --schnitte 6.16,11.59,20.14,27.41,34.98,42.76,51.12
# Schneiden: python3 tools/schnitt.py videos/09-zahlungs-zeugnis --medien output/arbeit/09-zahlungs-zeugnis/audio \
#              --arbeitsordner output/arbeit/09-zahlungs-zeugnis/schnitt --ausgabe output/zahlungs-zeugnis.mp4

[video]
nummer = "09"
titel = "Dein Zahlungs-Zeugnis"
thema = "Schufa-Score und Zahlungsverhalten bei der Wohnungssuche"
lerneffekt = "Dein Zahlungsverhalten kann beeinflussen, ob du eine Wohnung oder einen Vertrag bekommst. Pünktlich zahlen, Rechnungen nicht liegen lassen, gespeicherte Daten im Blick behalten."
zielgruppe = "breit: Teenager, Azubis, Berufseinsteiger"
ton = "trockener, sarkastischer Erzähler im Stil einer ruhigen Naturdoku, Understatement"
disclaimer = "Keine Finanzberatung"
referenzbild = "bibliothek/bilder/brokey-abos.jpg"
caption = "TODO: Caption auswählen"
hashtags = ["#finanzen", "#schufa", "#wohnung", "#finanzbildung"]
betonen = ["Zahlungsverhalten", "pünktlich bezahlen", "Dauerauftrag", "Keine Finanzberatung"]
# Sprechzeit 60,6 s: Vorlauf/Pause je 0,2 s, damit es bei 60-64 s bleibt (Atempausen kommen dazu)
